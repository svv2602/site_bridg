# Development overrides (auto-loaded by Docker Compose)
# Usage: docker compose up
services:
  postgres:
    ports:
      - "5434:5432"

  backend:
    ports:
      - "3001:3001"
    volumes:
      - ./backend-payload/media:/app/media
      - ./backend-payload/db_size_auto:/app/db_size_auto:ro
      - ./backend-payload/logs:/app/logs
      - ./backend-payload/data:/app/data
      - ./backend-payload/content-automation/data:/app/content-automation/data

  frontend:
    ports:
      - "3010:3010"
    environment:
      # Skip image optimization in dev (localhost resolves to private IP in Docker)
      SKIP_IMAGE_OPTIMIZATION: "true"
