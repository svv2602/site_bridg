# Production overrides
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  postgres:
    # No external port mapping in production
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G

  backend:
    restart: unless-stopped
    # No direct port exposure — nginx proxies traffic
    volumes:
      - ./backend-payload/media:/app/media
      - ./backend-payload/logs:/app/logs
      - ./backend-payload/data:/app/data
      - ./backend-payload/content-automation/data:/app/content-automation/data
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G

  frontend:
    restart: unless-stopped
    # No direct port exposure — nginx proxies traffic
    environment:
      # Enable image optimization in production (requires proper NEXT_PUBLIC_PAYLOAD_URL)
      SKIP_IMAGE_OPTIMIZATION: "false"
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'"
