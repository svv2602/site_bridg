name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Build & Test)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-payload/package-lock.json

      - name: Install dependencies
        working-directory: backend-payload
        run: npm ci

      - name: Run tests
        working-directory: backend-payload
        run: npm run test

      - name: Generate Payload types
        working-directory: backend-payload
        run: npx payload generate:types
        env:
          PAYLOAD_SECRET: ci-test-secret-must-be-at-least-32-characters
          DATABASE_URI: postgresql://dummy:dummy@localhost:5432/dummy

      - name: Build
        working-directory: backend-payload
        run: npm run build
        env:
          PAYLOAD_SECRET: ci-test-secret-must-be-at-least-32-characters
          DATABASE_URI: postgresql://dummy:dummy@localhost:5432/dummy

  frontend:
    name: Frontend (Lint & Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3001

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-payload
          push: false
          tags: bridgestone-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          tags: bridgestone-frontend:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_PAYLOAD_URL=http://localhost:3001
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bridgestone-backend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bridgestone-frontend:${{ github.sha }}
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH
        continue-on-error: true
