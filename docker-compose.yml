services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bridgestone
      POSTGRES_PASSWORD: bridgestone
      POSTGRES_DB: bridgestone
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bridgestone"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-payload
      dockerfile: Dockerfile
    environment:
      DATABASE_URI: postgresql://bridgestone:bridgestone@postgres:5432/bridgestone
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-change-me-in-production-min-32-chars}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL:-http://localhost:3001}
      NODE_ENV: production
      # Vehicles database (uses same postgres container)
      VEHICLES_DB_HOST: postgres
      VEHICLES_DB_PORT: "5432"
      VEHICLES_DB_NAME: bridgestone
      VEHICLES_DB_USER: bridgestone
      VEHICLES_DB_PASSWORD: bridgestone
      # AI Providers (set in .env file)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Payload CMS auth for content automation (set in .env)
      PAYLOAD_ADMIN_EMAIL: ${PAYLOAD_ADMIN_EMAIL:-}
      PAYLOAD_ADMIN_PASSWORD: ${PAYLOAD_ADMIN_PASSWORD:-}
      # Telegram notifications (optional)
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      # Frontend revalidation (ISR cache busting)
      FRONTEND_URL: http://frontend:3010
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend-payload/media:/app/media
      - ./backend-payload/content-automation/data:/app/content-automation/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_PAYLOAD_URL: ${NEXT_PUBLIC_PAYLOAD_URL:-http://localhost:3001}
        NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
        NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
        NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
    environment:
      # Internal API URL for server-side requests (container-to-container)
      PAYLOAD_API_URL: http://backend:3001
      # Public URL for image URLs (accessible from browser)
      NEXT_PUBLIC_PAYLOAD_URL: http://localhost:3001
      # Vehicles database for tyre search by car
      DATABASE_URL: postgresql://bridgestone:bridgestone@postgres:5432/bridgestone
      # Analytics (optional, set in .env file)
      NEXT_PUBLIC_GA4_MEASUREMENT_ID: ${NEXT_PUBLIC_GA4_MEASUREMENT_ID:-}
      NEXT_PUBLIC_META_PIXEL_ID: ${NEXT_PUBLIC_META_PIXEL_ID:-}
      # Google Maps for dealers page (optional)
      NEXT_PUBLIC_GOOGLE_MAPS_API_KEY: ${NEXT_PUBLIC_GOOGLE_MAPS_API_KEY:-}
      # ISR revalidation secret (must match backend)
      REVALIDATION_SECRET: ${REVALIDATION_SECRET:-}
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
